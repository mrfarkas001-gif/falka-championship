<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falka Admin</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/admin.css"></head><body><div class="overlay"></div><header class="top"><div class="brand">🐺 FALKA <small>ADMIN PANEL</small></div><a href="/">Vissza a weboldalra</a></header><main class="admin">
<section id="loginPanel" class="panel box"><p class="eyebrow">ADMINISZTRÁCIÓ</p><h1>Admin belépés</h1><form id="loginForm"><label>Jelszó<input id="password" type="password" placeholder="Admin jelszó" required></label><button class="gold">Belépés</button></form><p id="loginError" class="error"></p><p class="hint">Kezdeti jelszó: <b>ABC123abc123</b>. A main.py elején módosítható.</p></section>
<div id="adminPanel" class="hidden">
<section class="panel box"><h2>Játékos hozzáadása</h2><form id="addForm" class="inline"><input id="newName" placeholder="Játékosnév" required maxlength="40"><button class="gold">Hozzáadás</button></form></section>
<section class="panel box"><h2>Játékos statisztikái</h2><label>Játékos kiválasztása<select id="playerSelect"></select></label><form id="statsForm" class="grid"><label>Játékosnév<input id="editName" required></label><label>Csaták<input id="battles" type="number" min="0" required></label><label>Nyert csaták<input id="wins" type="number" min="0" required></label><label>Eliminálás<input id="eliminations" type="number" min="0" required></label><label>Hóhér<input id="executioner" type="number" min="0" required></label><div class="full actions"><button class="gold">Mentés</button><button type="button" id="deletePlayer" class="red">Játékos törlése</button></div></form></section>
<section class="panel box"><h2>Kitüntetés rögzítése</h2><form id="awardForm" class="grid"><label>Csata azonosítója<input id="battleLabel" placeholder="Csata #12" required></label><label>Dátum<input id="battleDate" type="date"></label><label>Kitüntetés<select id="category"><option value="executioner">Hóhér</option><option value="wolf_elimination">A farkas eliminálása</option><option value="wolf_savior">A farkas megmentője</option></select></label><label class="full">Játékos(ok)<small>Hóhér és eliminálás: egy játékos. Megmentő: több játékos is választható (Ctrl/Cmd).</small><select id="awardPlayers" multiple size="6"></select></label><label class="full">Megjegyzés<input id="note"></label><div class="full"><button class="gold">Kitüntetés mentése</button></div></form></section>
<section class="panel box"><h2>Rögzített kitüntetések</h2><div id="awardHistory"></div></section><button id="logout" class="red">Kijelentkezés</button><p id="message"></p></div></main><script src="/static/admin.js"></script></body></html>
